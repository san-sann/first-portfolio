					<section class="filter" id="filter">
						<h1 class="filter__title">Filter</h1>
						<form class="filter__form">
							<div class="filter__grid">
								<div class="filter__field">
									<label for="filter-name" class="filter__label">Name</label>
									<input type="text" id="filter-name" name="name" class="filter__input" placeholder="Andrew Salgado">
								</div>
								<div class="filter__field">
									<label for="filter-cv" class="filter__label">CV</label>
									<input type="search" id="filter-cv" name="cv" class="filter__input" placeholder="Search...">
									<div class="filter__checkbox-row" role="group" aria-label="Search CV within">
										<label data-fls-checkbox="" class="checkbox">
											<input class="checkbox__input" type="checkbox" value="capability" name="cv_scope[]" checked>
											<span class="checkbox__text">Capability</span>
										</label>
										<label data-fls-checkbox="" class="checkbox">
											<input class="checkbox__input" type="checkbox" value="technology" name="cv_scope[]" checked>
											<span class="checkbox__text">Technology</span>
										</label>
										<label data-fls-checkbox="" class="checkbox">
											<input class="checkbox__input" type="checkbox" value="certificate" name="cv_scope[]" checked>
											<span class="checkbox__text">Certificate</span>
										</label>
										<label data-fls-checkbox="" class="checkbox">
											<input class="checkbox__input" type="checkbox" value="course" name="cv_scope[]" checked>
											<span class="checkbox__text">Course</span>
										</label>
									</div>
								</div>
								<div class="filter__field">
									<label for="filter-email" class="filter__label">Email address</label>
									<input type="email" id="filter-email" name="email" class="filter__input" placeholder="example@mail.com">
								</div>
								<div class="filter__field">
									<div class="filter__group-header">
										<label for="filter-capabilities" class="filter__label" id="filter-capabilities-label">Capabilities</label>
										<div class="options filter__radio" data-fls-radio="" role="radiogroup" aria-labelledby="filter-capabilities-label">
											<label class="options__item">
												<input class="options__input" type="radio" name="capabilities-mode" value="and">
												<span class="options__text">AND</span>
											</label>
											<label class="options__item">
												<input class="options__input" type="radio" name="capabilities-mode" value="or" checked>
												<span class="options__text">OR</span>
											</label>
										</div>
									</div>
									<input type="search" id="filter-capabilities" name="capabilities" class="filter__input" placeholder="Search...">
								</div>
								<div class="filter__row">
									<div class="filter__field">
										<label for="filter-login" class="filter__label">Login</label>
										<input type="text" id="filter-login" name="login" class="filter__input" placeholder="Login">
									</div>
									<div class="filter__field">
										<label for="filter-branch" class="filter__label">Branch</label>
										<select data-fls-select="" data-fls-select-modif="filter" id="filter-branch" name="branch">
											<option value="">Select</option>
											<option value="kyiv">Kyiv</option>
											<option value="lviv">Lviv</option>
											<option value="warsaw">Warsaw</option>
											<option value="berlin">Berlin</option>
											<option value="remote">Remote</option>
										</select>
									</div>
								</div>
								<div class="filter__field">
									<div class="filter__group-header">
										<label for="filter-technology" class="filter__label" id="filter-technology-label">Technology</label>
										<div class="options filter__radio" data-fls-radio="" role="radiogroup" aria-labelledby="filter-technology-label">
											<label class="options__item">
												<input class="options__input" type="radio" name="technology-mode" value="and">
												<span class="options__text">AND</span>
											</label>
											<label class="options__item">
												<input class="options__input" type="radio" name="technology-mode" value="or" checked>
												<span class="options__text">OR</span>
											</label>
										</div>
									</div>
									<input type="search" id="filter-technology" name="technology" class="filter__input" placeholder="Search...">
								</div>
								<div class="filter__row">
									<div class="filter__field">
										<label for="filter-1c-id" class="filter__label">1C id</label>
										<input type="text" id="filter-1c-id" name="onec_id" class="filter__input" placeholder="Id">
									</div>
									<div class="filter__field">
										<label for="filter-practice" class="filter__label">Practice</label>
										<select data-fls-select="" data-fls-select-modif="filter" id="filter-practice" name="practice">
											<option value="">Select</option>
											<option value="delivery-billable">Delivery Billable</option>
											<option value="administration">Administration</option>
											<option value="ceo-office">CEO Office</option>
											<option value="sales">Sales</option>
											<option value="bench">Bench</option>
										</select>
									</div>
								</div>
								<div class="filter__field">
									<div class="filter__group-header">
										<label for="filter-certificates" class="filter__label" id="filter-certificates-label">Certificates</label>
										<div class="options filter__radio" data-fls-radio="" role="radiogroup" aria-labelledby="filter-certificates-label">
											<label class="options__item">
												<input class="options__input" type="radio" name="certificates-mode" value="and">
												<span class="options__text">AND</span>
											</label>
											<label class="options__item">
												<input class="options__input" type="radio" name="certificates-mode" value="or" checked>
												<span class="options__text">OR</span>
											</label>
										</div>
									</div>
									<input type="search" id="filter-certificates" name="certificates" class="filter__input" placeholder="Search...">
								</div>
								<div class="filter__field">
									<label for="filter-user-type" class="filter__label">User type</label>
									<select data-fls-select="" data-fls-select-modif="filter" id="filter-user-type" name="user_type">
										<option value="">Any</option>
										<option value="employee">Employee</option>
										<option value="contractor">Contractor</option>
										<option value="intern">Intern</option>
										<option value="freelancer">Freelancer</option>
									</select>
								</div>
								<div class="filter__field">
									<div class="filter__group-header">
										<label for="filter-courses" class="filter__label" id="filter-courses-label">Cources</label>
										<div class="options filter__radio" data-fls-radio="" role="radiogroup" aria-labelledby="filter-courses-label">
											<label class="options__item">
												<input class="options__input" type="radio" name="courses-mode" value="and">
												<span class="options__text">AND</span>
											</label>
											<label class="options__item">
												<input class="options__input" type="radio" name="courses-mode" value="or" checked>
												<span class="options__text">OR</span>
											</label>
										</div>
									</div>
									<input type="search" id="filter-courses" name="courses" class="filter__input" placeholder="Search...">
								</div>
								<div class="filter__field">
									<label for="filter-contract-type" class="filter__label">User contract type</label>
									<select data-fls-select="" data-fls-select-modif="filter" id="filter-contract-type" name="contract_type">
										<option value="">Any</option>
										<option value="full-time">Full-time</option>
										<option value="part-time">Part-time</option>
										<option value="contract">Contract</option>
										<option value="internship">Internship</option>
									</select>
								</div>
								<div class="filter__row">
									<div class="filter__field">
										<label for="filter-education" class="filter__label">Education</label>
										<select data-fls-select="" data-fls-select-modif="filter" id="filter-education" name="education">
											<option value="">Select</option>
											<option value="bachelor">Bachelor's Degree</option>
											<option value="master">Master's Degree</option>
											<option value="phd">PhD</option>
											<option value="associate">Associate Degree</option>
										</select>
									</div>
									<div class="filter__field">
										<label for="filter-education-search" class="visually-hidden">Search for specialization</label>
										<input type="search" id="filter-education-search" name="education_search" class="filter__input" placeholder="Search for specialization">
									</div>
								</div>
								<div class="filter__field filter__checkbox-stack">
									<label data-fls-checkbox="" class="checkbox">
										<input class="checkbox__input" type="checkbox" value="1" name="display_fields[]" checked>
										<span class="checkbox__text">Show User Type, Login, Start Date, 1C Id</span>
									</label>
									<label data-fls-checkbox="" class="checkbox">
										<input class="checkbox__input" type="checkbox" value="1" name="display_contacts[]">
										<span class="checkbox__text">Show Skype, Office phone, Mobile phone, Room number, Title</span>
									</label>
								</div>
								<div class="filter__field filter__checkbox-stack">
									<label data-fls-checkbox="" class="checkbox">
										<input class="checkbox__input" type="checkbox" value="1" name="show_current_assignments">
										<span class="checkbox__text">Show current assignments</span>
									</label>
									<label data-fls-checkbox="" class="checkbox">
										<input class="checkbox__input" type="checkbox" value="1" name="include_terminated">
										<span class="checkbox__text">Include terminated employees</span>
									</label>
								</div>
							</div>
							<div class="filter__actions">
								<button type="button" data-fls-button="" class="filter__clear button">Clear</button>
								<button type="submit" data-fls-button="" class="filter__search button">Search</button>
							</div>
						</form>
					</section>
				</main>
			</div>
			<footer data-fls-footer="" class="footer">
				<div class="footer__container"></div>
			</footer>
