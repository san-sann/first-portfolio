<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="shortcut icon" href="./assets/img/favicon.ico">
		<meta name="description" content="Sign in to your account.">
		<meta property="og:title" content="Log In">
		<meta property="og:type" content="website">
		<meta property="og:image" content="https://camioca-internal-panel.vercel.app/assets/img/og/preview.png">
		<meta property="og:url" content="https://camioca-internal-panel.vercel.app/login.html">
		<title>Log In</title>
		<script type="module" crossorigin="" src="./js/login.min.js?v=1788984567288"></script>
		<link rel="modulepreload" crossorigin="" href="./js/main.min.js?v=1788984567288">
		<link rel="modulepreload" crossorigin="" href="./js/_functions.min.js?v=1788984567288">
		<link rel="modulepreload" crossorigin="" href="./js/form.min.js?v=1788984567288">
		<link rel="stylesheet" crossorigin="" href="./css/main.min.css?v=1788984567288">
		<link rel="stylesheet" crossorigin="" href="./css/form.min.css?v=1788984567288">
		<link rel="stylesheet" crossorigin="" href="./css/login.min.css?v=1788984567288">
		<link rel="stylesheet" crossorigin="" href="./css/button.min.css?v=1788984567288">
	</head>
	<body>
		<div class="wrapper">
			<div class="wrapper__shell">
				<main class="page">
					<div class="login-decor" aria-hidden="true">
						<div class="login-decor__blob login-decor__blob--purple"></div>
						<div class="login-decor__blob login-decor__blob--teal"></div>
						<div class="login-decor__blob login-decor__blob--red"></div>
					</div>
					<section class="brand" id="brand">
						<h1 class="brand__title">CAMIOCA</h1>
						<p>Intelligent Service</p>
					</section>
					<section class="form" id="form">
						<form class="form__fields" data-fls-form="dev">
							<h2 class="form__title">Welcome back!</h2>
							<div class="field">
								<label class="field__label" for="login-email">Email address</label>
								<div class="field__control">
									<input class="field__input" id="login-email" type="email" name="email" placeholder="example@mail.com" autocomplete="username" required data-fls-input="" data-fls-form-validatenow="" data-fls-form-errtext="Enter a valid email address">
									<svg class="field__status" aria-hidden="true" width="18" height="18">
										<use xlink:href="./assets/img/spritemap.svg#sprite-check-circle"></use>
									</svg>
								</div>
							</div>
							<div class="field">
								<label class="field__label" for="login-password">Password</label>
								<div class="field__control">
									<input class="field__input" id="login-password" type="password" name="password" placeholder="Password" autocomplete="current-password" required data-fls-input="" data-fls-form-validatenow="" data-fls-form-errtext="Password is required">
									<button type="button" class="field__toggle" data-fls-input-viewpass="" aria-pressed="false" aria-label="Show password">
										<svg aria-hidden="true" width="18" height="18">
											<use xlink:href="./assets/img/spritemap.svg#sprite-visibility-off"></use>
										</svg>
									</button>
								</div>
							</div>
							<p>Use at least 8 characters with 1 number, and one special character.</p>
							<button type="submit" class="form__submit button button--fw" data-fls-button="">LOG IN</button>
						</form>
						<a href="resetpassword.html" class="form__forgot">Forgot password?</a>
					</section>
				</main>
			</div>
			<footer data-fls-footer="" class="footer">
				<div class="footer__container"></div>
			</footer>
		</div>
	</body>
</html>
