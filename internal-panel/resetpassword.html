<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="shortcut icon" href="./assets/img/favicon.ico">
		<meta name="description" content="Reset your account password.">
		<meta property="og:title" content="Reset Password">
		<meta property="og:type" content="website">
		<meta property="og:image" content="https://camioca-internal-panel.vercel.app/assets/img/og/preview.png">
		<meta property="og:url" content="https://camioca-internal-panel.vercel.app/resetpassword.html">
		<title>Reset Password</title>
		<script type="module" crossorigin="" src="./js/resetpassword.min.js?v=1788984567276"></script>
		<link rel="modulepreload" crossorigin="" href="./js/main.min.js?v=1788984567276">
		<link rel="modulepreload" crossorigin="" href="./js/_functions.min.js?v=1788984567276">
		<link rel="modulepreload" crossorigin="" href="./js/form.min.js?v=1788984567276">
		<link rel="stylesheet" crossorigin="" href="./css/main.min.css?v=1788984567276">
		<link rel="stylesheet" crossorigin="" href="./css/form.min.css?v=1788984567276">
		<link rel="stylesheet" crossorigin="" href="./css/resetpassword.min.css?v=1788984567276">
		<link rel="stylesheet" crossorigin="" href="./css/button.min.css?v=1788984567276">
	</head>
	<body>
		<div class="wrapper">
			<div class="wrapper__shell">
				<main class="page">
					<section class="brand" id="brand">
						<h1 class="brand__title">CAMIOCA</h1>
						<p>Intelligent Service</p>
					</section>
					<section class="form" id="form">
						<form class="form__fields" data-fls-form="dev">
							<h2 class="form__title">Reset password</h2>
							<p>
								Enter the email address associated with your account, and we'll send you a link to reset your password.
							</p>
							<div class="field">
								<label class="field__label" for="reset-email">Email address</label>
								<div class="field__control">
									<input class="field__input" id="reset-email" type="email" name="email" placeholder="example@mail.com" autocomplete="username" required data-fls-input="" data-fls-form-validatenow="" data-fls-form-errtext="Enter a valid email address">
								</div>
							</div>
							<button type="submit" class="form__submit button button--fw" data-fls-button="">SEND RESET LINK</button>
						</form>
						<a href="login.html" class="form__back">Back to Log In</a>
					</section>
				</main>
			</div>
			<footer data-fls-footer="" class="footer">
				<div class="footer__container"></div>
			</footer>
		</div>
	</body>
</html>
