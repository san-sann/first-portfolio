<!doctype html>
<html lang="en">
	<head>
		<script>
      history.scrollRestoration = "manual";
		</script>
		<script>
    // Demo seed so the Cart page is reachable on a first visit. Runs sync in
    // head, before markup and modules, so the cart guard and the header
    // counter both see the filled state.
    try {
      if (!localStorage.getItem('euphoria-cart-seeded')) {
        localStorage.setItem('euphoria-cart-seeded', '1')
        if (!localStorage.getItem('euphoria-cart')) {
          localStorage.setItem(
            'euphoria-cart',
            JSON.stringify([{
                id: 'blue-flower-print-crop-top',
                title: 'Blue Flower Print Crop Top',
                price: 29,
                shipping: 0,
                qty: 1,
                size: 'M',
                color: 'Yellow',
                image: 'assets/img/cart/products/photos/photo-1.jpg',
                alt: 'Blue flower print crop top on a model',
              },
              {
                id: 'levender-hoodie',
                title: 'Levender Hoodie',
                price: 119,
                shipping: 0,
                qty: 1,
                size: 'XXL',
                color: 'Levender',
                image: 'assets/img/cart/products/photos/photo-2.jpg',
                alt: 'Lavender hoodie on a model',
              },
              {
                id: 'black-sweatshirt',
                title: 'Black Sweatshirt',
                price: 123,
                shipping: 0,
                qty: 1,
                size: 'XXL',
                color: 'Black',
                image: 'assets/img/cart/products/photos/photo-3.jpg',
                alt: 'Black sweatshirt on a model',
              },
            ])
          )
        }
      }
    } catch (e) {}
	</script>
		<script>
  // Demo seed so the Wishlist page is reachable on a first visit. Ids match
  // products-new.json, so the heart also shows active on those product cards.
  try {
    if (!localStorage.getItem('euphoria-wishlist-seeded')) {
      localStorage.setItem('euphoria-wishlist-seeded', '1')
      if (!localStorage.getItem('euphoria-wishlist')) {
        localStorage.setItem(
          'euphoria-wishlist',
          JSON.stringify([{
              id: 'black-sweatshirt-jhanvi',
              title: 'Black Sweatshirt with ....',
              price: 123,
              brand: 'Jhanvi’s Brand',
              image: 'assets/img/wishlist/photos/photo-1.jpg',
              alt: 'Black Sweatshirt with ....',
            },
            {
              id: 'white-graphic-crop-top-woden',
              title: 'White Graphic Crop Top',
              price: 29,
              brand: 'woden’s Brand',
              image: 'assets/img/wishlist/photos/photo-2.jpg',
              alt: 'White Graphic Crop Top',
            },
          ])
        )
      }
    }
  } catch (e) {}
</script>

		<link rel="preload" href="./assets/fonts/Causten-SemiBold.woff2" as="font" type="font/woff2" crossorigin="anonymous">
		<link rel="preload" href="./assets/fonts/Causten-Regular.woff2" as="font" type="font/woff2" crossorigin="anonymous">

		<title>Sign Up – Euphoria</title>
		<script type="module" crossorigin="" src="./js/signup.min.js?v=1786191466750"></script>
		<link rel="modulepreload" crossorigin="" href="./js/main.min.js?v=1786191466750">
		<link rel="modulepreload" crossorigin="" href="./js/select.min.js?v=1786191466750">
		<link rel="modulepreload" crossorigin="" href="./js/header-auth.min.js?v=1786191466750">
		<link rel="modulepreload" crossorigin="" href="./js/button2.min.js?v=1786191466750">
		<link rel="stylesheet" crossorigin="" href="./css/main.min.css?v=1786191466750">
		<link rel="stylesheet" crossorigin="" href="./css/select.min.css?v=1786191466750">
		<link rel="stylesheet" crossorigin="" href="./css/header-auth.min.css?v=1786191466750">
		<link rel="stylesheet" crossorigin="" href="./css/button.min.css?v=1786191466750">
		<link rel="stylesheet" crossorigin="" href="./css/signup.min.css?v=1786191466750">
	</head>
	<body>
		<div class="wrapper">
			<header data-fls-header-auth="" class="header-auth">
				<div class="header-auth__container">
					<a href="index.html" class="header-auth__logo-link">
						<img class="header-auth__logo" src="./assets/img/logo.svg" alt="Euphoria — home">
					</a>
					<div class="header-auth__end">
						<div class="header-auth__search">
							<button type="button" class="header-auth__search-toggle" data-header-auth-search-toggle="" aria-expanded="false" aria-controls="header-auth-search-panel" aria-label="Toggle search">
								<svg class="icon" aria-hidden="true">
									<use xlink:href="./assets/img/spritemap.svg#sprite-search"></use>
								</svg>
							</button>
							<form data-fls-form="dev" action="#" id="header-auth-search-panel" class="header-auth__search-panel search-form" hidden>
								<label class="visually-hidden" for="header-auth-search-input">Search products</label>
								<input id="header-auth-search-input" class="search-form__input" name="form[search]" placeholder="Search" type="search">
								<button type="submit" class="search-form__button" aria-label="Search">
									<svg class="icon" aria-hidden="true">
										<use xlink:href="./assets/img/spritemap.svg#sprite-search"></use>
									</svg>
								</button>
							</form>
						</div>
						<select id="header-auth-lang" class="header-auth__lang" data-fls-select="" data-fls-select-modif="header-auth" name="lang" aria-label="Language and region">
							<option value="en-US" data-fls-select-asset="🇺🇸 EN" selected>English (United States)</option>
							<option value="en-GB" data-fls-select-asset="🇬🇧 EN">English (United Kingdom)</option>
							<option value="uk-UA" data-fls-select-asset="🇺🇦 UA">Українська (Україна)</option>
						</select>
						<div class="header-auth__actions">
							<a href="signin.html" class="header-auth__login button" data-fls-button="">Login</a>
							<a href="signup.html" class="header-auth__signup button button--secondary" data-fls-button="" aria-current="page">Sign Up</a>
						</div>
					</div>
				</div>
			</header>
			<main class="page">
				<section class="signup">
					<div class="signup__content">
						<h1 class="signup__title">Sign Up</h1>
						<p class="signup__intro">Sign up for free to access to in any of our products</p>
						<form data-fls-form="dev" action="#" method="POST" class="signup__form">
							<div class="signup__socials">
								<button type="button" class="signup__social button button--secondary" data-fls-button="">
									<img class="signup__social-icon" src="./assets/img/signup/icons/google.svg" alt="" width="18" height="18">
									Continue With Google
								</button>
								<button type="button" class="signup__social button button--secondary" data-fls-button="">
									<img class="signup__social-icon" src="./assets/img/signup/icons/twitter.svg" alt="" width="22" height="18">
									Continue With Twitter
								</button>
							</div>
							<div class="signup__line">
								<label for="signup-email" class="signup__label">Email Address</label>
								<input id="signup-email" class="signup__input" type="email" name="email" autocomplete="email" required data-fls-form-validatenow="" data-fls-form-errtext="Enter a valid email address">
							</div>
							<div class="signup__line">
								<div class="signup__password-head">
									<label for="signup-password" class="signup__label">Password</label>
									<button type="button" class="signup__toggle-password" data-signup-toggle-password="" aria-pressed="false" aria-controls="signup-password">
										<svg class="icon signup__eye-icon" aria-hidden="true">
											<use xlink:href="./assets/img/spritemap.svg#sprite-eye"></use>
										</svg>
										<span data-signup-toggle-label="">Show</span>
									</button>
								</div>
								<input id="signup-password" class="signup__input" type="password" name="password" autocomplete="new-password" minlength="8" required data-fls-form-validatenow="" data-fls-form-errtext="Password does not meet the requirements above">
								<p class="signup__hint">Use 8 or more characters with a mix of letters, numbers &amp; symbols</p>
							</div>
							<div class="signup__checkboxes">
								<label class="signup__checkbox">
									<input id="signup-agree-terms" class="signup__checkbox-input" type="checkbox" name="agreeTerms" value="1" required data-fls-form-errtext="You must agree to the Terms of use and Privacy Policy">
									<span class="signup__checkbox-box" aria-hidden="true"></span>
									<span class="signup__checkbox-text">
										Agree to our
										<a href="#" class="signup__checkbox-link">Terms of use</a>
										and
										<a href="#" class="signup__checkbox-link">Privacy Policy</a>
									</span>
								</label>
								<label class="signup__checkbox">
									<input id="signup-subscribe-newsletter" class="signup__checkbox-input" type="checkbox" name="subscribeNewsletter" value="1">
									<span class="signup__checkbox-box" aria-hidden="true"></span>
									<span class="signup__checkbox-text">Subscribe to our monthly newsletter</span>
								</label>
							</div>
							<button type="submit" class="signup__submit button" data-fls-button="">Sign Up</button>
							<p class="signup__signin">
								Already have an account?
								<a href="signin.html" class="signup__signin-link">Log in</a>
							</p>
						</form>
					</div>
					<div class="signup__media">
						<picture>
							<source media="(max-width: 600px)" srcset="./assets/img/signup/Image-600.webp" type="image/webp">
							<img class="signup__photo" alt="Four friends laughing together against a yellow backdrop" loading="eager" width="694" height="952" src="./assets/img/signup/Image.webp">
						</picture>
					</div>
				</section>
			</main>
		</div>
	</body>
</html>
